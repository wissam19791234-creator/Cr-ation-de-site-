<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pub 14s — Démo gratuite site web</title>
  <meta name="description" content="Storyboard HTML/CSS premium 9:16 en deux clips de 7 secondes, basé sur 30 photos de référence." />
  <style>
    :root{--ink:#07080D;--midnight:#0E172A;--navy:#121A33;--ivory:#FFF8ED;--champagne:#D8AD5E;--beige:#EADCC8;--lilac:#D8CCFF;--blue:#83C6FF;--duration:14s}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#05060a;color:var(--ivory);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} body{display:grid;place-items:center;padding:20px;overflow-x:hidden}.wrap{display:grid;gap:14px;justify-items:center}.note{max-width:590px;color:rgba(255,248,237,.72);font-size:14px;line-height:1.45;text-align:center}.note b{color:var(--champagne)}
    .ad{position:relative;width:min(100vw - 24px,430px);aspect-ratio:9/16;overflow:hidden;border-radius:38px;background:radial-gradient(circle at 75% 18%,rgba(216,173,94,.28),transparent 33%),radial-gradient(circle at 12% 72%,rgba(131,198,255,.18),transparent 38%),linear-gradient(145deg,var(--ink),var(--midnight) 53%,var(--navy));box-shadow:0 30px 120px rgba(0,0,0,.64),0 0 0 1px rgba(255,248,237,.08);isolation:isolate;perspective:1200px;transform-style:preserve-3d}
    .ad:before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");opacity:.11;mix-blend-mode:overlay;pointer-events:none;z-index:80}.ad:after{content:"";position:absolute;inset:-25%;width:24%;background:linear-gradient(90deg,transparent,rgba(216,173,94,.30),rgba(255,248,237,.19),transparent);filter:blur(1px);transform:translateX(-260%) rotate(18deg);animation:sweep var(--duration) cubic-bezier(.55,0,.18,1) infinite;z-index:70;mix-blend-mode:screen}
    .safe-zone{position:absolute;left:28px;right:28px;top:46px;height:142px;border-radius:28px;background:linear-gradient(180deg,rgba(7,8,13,.34),rgba(7,8,13,.08));border:1px solid rgba(255,248,237,.06);backdrop-filter:blur(7px);opacity:.55;z-index:18}.safe-zone.bottom{top:auto;bottom:58px;height:116px}.depth-grid{position:absolute;inset:-10%;background:linear-gradient(rgba(216,173,94,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(131,198,255,.05) 1px,transparent 1px);background-size:46px 46px;transform:rotateX(67deg) translateY(35%) translateZ(-130px);transform-origin:center bottom;opacity:.42;animation:gridMove var(--duration) linear infinite;z-index:1}.orb{position:absolute;border-radius:999px;background:radial-gradient(circle at 30% 25%,rgba(255,248,237,.95),rgba(216,173,94,.34) 38%,rgba(216,173,94,0) 70%);box-shadow:0 0 55px rgba(216,173,94,.32);opacity:.66;z-index:2}.orb.one{width:150px;height:150px;right:-30px;top:62px;animation:orb1 6s ease-in-out infinite}.orb.two{width:105px;height:105px;left:-24px;bottom:160px;background:radial-gradient(circle at 30% 25%,rgba(255,248,237,.72),rgba(131,198,255,.3) 42%,rgba(131,198,255,0) 72%);animation:orb2 7s ease-in-out infinite}
    .scene{position:absolute;inset:0;opacity:0;filter:blur(12px);transform:translateY(22px) scale(.985) rotateX(5deg);animation:sceneShow var(--duration) linear infinite;transform-style:preserve-3d;z-index:10}.c1s1{animation-delay:0s}.c1s2{animation-delay:-12.5s}.c1s3{animation-delay:-10.5s}.c1s4{animation-delay:-8.5s}.c2s1{animation-delay:-7s}.c2s2{animation-delay:-5s}.c2s3{animation-delay:-3s}.c2s4{animation-delay:-1.5s}
    @keyframes sceneShow{0%,10.6%{opacity:1;filter:blur(0);transform:translateY(0) scale(1) rotateX(0)}12.5%,100%{opacity:0;filter:blur(12px);transform:translateY(-18px) scale(1.018) rotateX(-4deg)}}@keyframes sweep{0%,8%{transform:translateX(-260%) rotate(18deg);opacity:0}9%,13%,39%,45%,70%,76%,92%,99%{opacity:1}16%,49%,80%,100%{transform:translateX(540%) rotate(18deg);opacity:0}}@keyframes gridMove{0%{background-position:0 0;opacity:.25}50%{opacity:.46}100%{background-position:0 92px;opacity:.25}}@keyframes orb1{50%{transform:translate3d(-22px,32px,40px) scale(1.08)}}@keyframes orb2{50%{transform:translate3d(30px,-24px,60px) scale(.92)}}
    .ref-wall{position:absolute;inset:120px -60px auto -60px;height:440px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;opacity:0;transform:rotateZ(-8deg) rotateX(12deg) translateZ(-55px);z-index:3;animation:wallSwap var(--duration) linear infinite}.wall-1{animation-delay:0s}.wall-2{animation-delay:-7s}.ref-card{height:92px;border-radius:14px;overflow:hidden;background:rgba(255,248,237,.08);border:1px solid rgba(255,248,237,.1);box-shadow:0 18px 48px rgba(0,0,0,.25)}.ref-card img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) contrast(1.02);opacity:.72}.ref-card.missing img{display:none}.ref-card.missing:before{content:"";display:block;width:100%;height:100%;background:radial-gradient(circle at 70% 24%,rgba(216,173,94,.28),transparent 42%),linear-gradient(145deg,rgba(255,248,237,.1),rgba(131,198,255,.08))}@keyframes wallSwap{0%,49%{opacity:.28;transform:rotateZ(-8deg) rotateX(12deg) translateZ(-55px) translateY(0)}50%,100%{opacity:0;transform:rotateZ(-8deg) rotateX(12deg) translateZ(-55px) translateY(-24px)}}.photo-layer{position:absolute;inset:0;transform-style:preserve-3d}.photo{position:absolute;overflow:hidden;border-radius:28px;background:linear-gradient(145deg,rgba(255,248,237,.12),rgba(131,198,255,.07));border:1px solid rgba(255,248,237,.12);box-shadow:0 28px 75px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.1);transform-style:preserve-3d}.photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;filter:saturate(.9) contrast(1.02)}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(7,8,13,.22),transparent 42%,rgba(216,173,94,.11));mix-blend-mode:screen}.photo.missing img{display:none}.photo.missing:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 20%,rgba(216,173,94,.30),transparent 40%),linear-gradient(145deg,rgba(255,248,237,.10),rgba(131,198,255,.08))}.hero-photo{left:54px;right:54px;top:205px;height:340px;transform:rotateY(-16deg) rotateX(7deg) translateZ(78px);animation:heroMove 7s ease-in-out infinite}.side-photo{width:148px;height:196px;top:355px;right:-34px;transform:rotateY(-28deg) rotateX(8deg) translateZ(20px);opacity:.7}.mini-a{width:135px;height:170px;left:-28px;top:405px;transform:rotateY(28deg) translateZ(18px);opacity:.62}@keyframes heroMove{50%{transform:rotateY(14deg) rotateX(4deg) translateY(-9px) translateZ(92px)}}
    .mock-phone{position:absolute;width:172px;height:345px;left:50%;top:248px;transform:translateX(-50%) rotateY(-18deg) rotateX(7deg) translateZ(115px);border-radius:34px;background:linear-gradient(145deg,#05060A,#222b47);box-shadow:28px 36px 85px rgba(0,0,0,.58),0 0 68px rgba(216,173,94,.2),inset 0 0 0 2px rgba(255,248,237,.16);padding:12px;animation:phoneOrbit 5.2s ease-in-out infinite}.mock-phone:before{content:"";position:absolute;top:10px;left:50%;width:56px;height:8px;border-radius:99px;background:rgba(255,248,237,.24);transform:translateX(-50%)}.screen{height:100%;border-radius:23px;overflow:hidden;background:linear-gradient(160deg,#101832,#07080D);border:1px solid rgba(255,248,237,.08)}@keyframes phoneOrbit{50%{transform:translateX(-50%) rotateY(15deg) rotateX(5deg) translateY(-8px) translateZ(130px)}}.ui-hero{height:32%;background:radial-gradient(circle at 72% 20%,rgba(216,173,94,.4),transparent 46%),linear-gradient(135deg,rgba(255,248,237,.12),rgba(131,198,255,.08));padding:22px 14px}.line{height:8px;border-radius:99px;background:rgba(255,248,237,.52);margin:9px 0}.line.short{width:58%}.line.mid{width:78%}.button{width:60%;height:30px;border-radius:99px;margin-top:15px;background:linear-gradient(135deg,#D8AD5E,#FFF0C8);box-shadow:0 0 30px rgba(216,173,94,.42)}.cards{display:grid;gap:10px;padding:14px}.card{border-radius:16px;background:rgba(255,248,237,.09);border:1px solid rgba(255,248,237,.1);height:64px;box-shadow:0 14px 34px rgba(0,0,0,.16)}
    .bubble{position:absolute;border-radius:23px;background:rgba(255,248,237,.12);border:1px solid rgba(255,248,237,.16);padding:12px 15px;min-width:92px;min-height:40px;box-shadow:0 18px 48px rgba(0,0,0,.25);backdrop-filter:blur(16px);transform-style:preserve-3d;animation:float3d 2.3s ease-in-out infinite}.bubble:nth-child(2n){background:rgba(216,204,255,.14)}.bubble i{display:block;height:7px;border-radius:99px;background:rgba(255,248,237,.52);margin:6px 0}.bubble i:nth-child(2){width:62%;background:rgba(216,173,94,.42)}.b1{left:28px;top:270px}.b2{right:28px;top:360px;animation-delay:.15s}.b3{left:42px;top:465px;animation-delay:.3s}.b4{right:50px;top:552px;animation-delay:.45s}.b5{left:82px;top:635px;animation-delay:.6s}@keyframes float3d{0%,100%{translate:0 -6px;rotate:0 1 0 -5deg}50%{translate:0 8px;rotate:0 1 0 7deg}}
    .split{position:absolute;left:22px;right:22px;top:205px;bottom:115px;border-radius:30px;overflow:hidden;border:1px solid rgba(255,248,237,.12);display:grid;grid-template-columns:1fr 1fr;box-shadow:0 38px 105px rgba(0,0,0,.42);transform:rotateX(5deg) rotateY(-7deg) translateZ(38px)}.split:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--champagne);box-shadow:0 0 24px rgba(216,173,94,.8)}.bad{background:linear-gradient(145deg,rgba(7,8,13,.93),rgba(18,26,51,.9));padding:18px;filter:saturate(.75) blur(.4px)}.good{background:linear-gradient(145deg,rgba(234,220,200,.2),rgba(131,198,255,.15));padding:18px;box-shadow:inset 0 0 70px rgba(216,173,94,.16)}.ghost{height:42px;border-radius:16px;background:rgba(255,248,237,.10);margin:10px 0}.clean-card{height:70px;border-radius:18px;background:rgba(255,248,237,.11);border:1px solid rgba(255,248,237,.13);margin:10px 0;padding:13px}.clean-card i{display:block;height:7px;width:76%;border-radius:9px;background:rgba(255,248,237,.65);margin:7px 0}.clean-card i:nth-child(2){width:52%;background:rgba(216,173,94,.68)}
    .dash{position:absolute;left:34px;right:34px;top:250px;height:300px;filter:drop-shadow(24px 32px 70px rgba(0,0,0,.5));transform:rotateY(11deg) rotateX(9deg) translateZ(60px);animation:dashFloat 3.4s ease-in-out infinite}.panel{height:88%;border-radius:24px;background:linear-gradient(145deg,#080A12,#18213D);border:5px solid rgba(255,248,237,.14);padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}@keyframes dashFloat{50%{transform:rotateY(-7deg) rotateX(7deg) translateY(-9px) translateZ(74px)}}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{height:58px;border-radius:14px;background:rgba(255,248,237,.09);border:1px solid rgba(255,248,237,.12);padding:9px}.kpi b{display:block;height:13px;width:62%;border-radius:99px;background:rgba(255,248,237,.68)}.kpi span{display:block;height:7px;width:76%;border-radius:99px;background:rgba(216,173,94,.55);margin-top:12px}.graph{height:105px;margin-top:14px;border-radius:16px;background:rgba(7,8,13,.34);border:1px solid rgba(255,248,237,.08)}.graph path{stroke-dasharray:450;stroke-dashoffset:450;animation:draw 2s ease-out infinite}@keyframes draw{40%,100%{stroke-dashoffset:0}}
    .form{position:absolute;left:48px;right:48px;top:215px;border-radius:30px;background:rgba(255,248,237,.1);border:1px solid rgba(255,248,237,.14);padding:22px;box-shadow:24px 34px 90px rgba(0,0,0,.36);backdrop-filter:blur(18px);transform:rotateY(-10deg) rotateX(7deg) translateZ(70px);animation:formPop 2.8s ease-in-out infinite}.field{height:38px;border-radius:13px;background:rgba(255,248,237,.08);border:1px solid rgba(255,248,237,.12);margin-bottom:10px;padding:8px 10px;position:relative}.field span{display:block;height:7px;border-radius:9px;background:linear-gradient(90deg,rgba(255,248,237,.86),rgba(216,173,94,.55));margin-top:6px;width:64%;animation:fill 2.2s ease-out infinite}.field:after{content:"✓";position:absolute;right:10px;top:9px;color:var(--champagne);font-size:16px}.form-btn{height:43px;border-radius:17px;background:linear-gradient(135deg,#D8AD5E,#FFE7B0);box-shadow:0 0 36px rgba(216,173,94,.38)}@keyframes fill{0%{width:20%;opacity:.35}60%,100%{opacity:1}}@keyframes formPop{50%{transform:rotateY(8deg) rotateX(4deg) translateY(-7px) translateZ(84px)}}
    .portfolio{position:absolute;inset:165px -70px auto -70px;height:395px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transform:rotateZ(-7deg) rotateX(10deg) translateZ(-10px);opacity:.55}.tile{height:110px;border-radius:16px;background:rgba(255,248,237,.08);border:1px solid rgba(255,248,237,.12);padding:10px;box-shadow:0 22px 60px rgba(0,0,0,.28);animation:tileWave 3s ease-in-out infinite}.tile:nth-child(2n){animation-delay:.25s}.tile div{height:38px;border-radius:12px;background:linear-gradient(135deg,rgba(216,173,94,.42),rgba(131,198,255,.22));margin-bottom:9px}.tile i{display:block;height:7px;border-radius:99px;background:rgba(255,248,237,.6);margin-top:8px;width:70%}@keyframes tileWave{50%{transform:translateY(-8px) rotateY(9deg)}}.cta-glow{position:absolute;left:24%;right:24%;bottom:75px;height:50px;border-radius:20px;background:linear-gradient(135deg,#D8AD5E,#FFE7B0);box-shadow:0 0 46px rgba(216,173,94,.48);animation:pulse 1.15s ease-in-out infinite;z-index:40}@keyframes pulse{0%,100%{transform:scale(.97) translateZ(95px)}50%{transform:scale(1.045) translateZ(110px)}}
    @media (min-width:760px){.ad{width:430px}}@media (prefers-reduced-motion:reduce){.scene,.ad:after,.depth-grid,.orb,.photo,.mock-phone,.bubble,.dash,.graph path,.form,.field span,.tile,.cta-glow{animation:none!important}.scene{opacity:0}.scene:first-of-type{opacity:1;filter:none;transform:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="ad" aria-label="Storyboard publicitaire premium en deux clips de sept secondes">
      <div class="depth-grid"></div><div class="ref-wall wall-1" aria-hidden="true"></div><div class="ref-wall wall-2" aria-hidden="true"></div><div class="orb one"></div><div class="orb two"></div><div class="safe-zone"></div><div class="safe-zone bottom"></div>
      <article class="scene c1s1"><div class="photo hero-photo"><img src="public/references/photo-01.jpg" alt="Photo référence 01" onerror="this.parentElement.classList.add('missing')"></div><div class="photo side-photo"><img src="public/references/photo-02.jpg" alt="Photo référence 02" onerror="this.parentElement.classList.add('missing')"></div><div class="mock-phone"><div class="screen"><div class="ui-hero"><div class="line mid"></div><div class="line short"></div><div class="button"></div></div><div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div></div></div></div></article>
      <article class="scene c1s2"><div class="photo mini-a"><img src="public/references/photo-03.jpg" alt="Photo référence 03" onerror="this.parentElement.classList.add('missing')"></div><div class="photo side-photo"><img src="public/references/photo-04.jpg" alt="Photo référence 04" onerror="this.parentElement.classList.add('missing')"></div><div class="bubble b1"><i></i><i></i></div><div class="bubble b2"><i></i><i></i></div><div class="bubble b3"><i></i><i></i></div><div class="bubble b4"><i></i><i></i></div><div class="bubble b5"><i></i><i></i></div></article>
      <article class="scene c1s3"><div class="photo hero-photo"><img src="public/references/photo-05.jpg" alt="Photo référence 05" onerror="this.parentElement.classList.add('missing')"></div><div class="bubble b1"><i></i><i></i></div><div class="bubble b2"><i></i><i></i></div><div class="bubble b3"><i></i><i></i></div><div class="bubble b4"><i></i><i></i></div></article>
      <article class="scene c1s4"><div class="split"><div class="bad"><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div></div><div class="good"><div class="clean-card"><i></i><i></i></div><div class="clean-card"><i></i><i></i></div><div class="clean-card"><i></i><i></i></div></div></div></article>
      <article class="scene c2s1"><div class="photo hero-photo"><img src="public/references/photo-12.jpg" alt="Photo référence 12" onerror="this.parentElement.classList.add('missing')"></div><div class="dash"><div class="panel"><div class="kpis"><div class="kpi"><b></b><span></span></div><div class="kpi"><b></b><span></span></div><div class="kpi"><b></b><span></span></div></div><div class="graph"><svg viewBox="0 0 300 95" width="100%" height="100%"><path d="M20 72 C60 55 75 30 118 46 S185 65 225 25 275 26 292 16" fill="none" stroke="#D8AD5E" stroke-width="6" stroke-linecap="round"/></svg></div></div></div></article>
      <article class="scene c2s2"><div class="dash"><div class="panel"><div class="kpis"><div class="kpi"><b></b><span></span></div><div class="kpi"><b></b><span></span></div><div class="kpi"><b></b><span></span></div></div><div class="graph"><svg viewBox="0 0 300 95" width="100%" height="100%"><path d="M20 72 C70 58 96 34 128 45 S205 64 242 24 276 28 292 16" fill="none" stroke="#83C6FF" stroke-width="6" stroke-linecap="round"/></svg></div></div></div><div class="photo mini-a"><img src="public/references/photo-18.jpg" alt="Photo référence 18" onerror="this.parentElement.classList.add('missing')"></div></article>
      <article class="scene c2s3"><div class="form"><div class="field"><span></span></div><div class="field"><span></span></div><div class="field"><span></span></div><div class="field"><span></span></div><div class="field"><span></span></div><div class="field"><span></span></div><div class="form-btn"></div></div><div class="photo side-photo"><img src="public/references/photo-24.jpg" alt="Photo référence 24" onerror="this.parentElement.classList.add('missing')"></div></article>
      <article class="scene c2s4"><div class="portfolio"></div><div class="photo hero-photo"><img src="public/references/photo-30.jpg" alt="Photo référence 30" onerror="this.parentElement.classList.add('missing')"></div><div class="mock-phone"><div class="screen"><div class="ui-hero"><div class="line mid"></div><div class="line short"></div><div class="button"></div></div><div class="cards"><div class="card"></div><div class="card"></div></div></div></div><div class="cta-glow"></div></article>
    </section>
    <p class="note"><b>Storyboard HTML 3D avec 30 photos :</b> place tes références dans <code>public/references/photo-01.jpg</code> à <code>photo-30.jpg</code>. Aucun texte lisible n’est généré dans la vidéo : ajoute les titres dans CapCut.</p>
  </main>
  <script>
    document.querySelector('.portfolio').innerHTML = Array.from({length:6},(_,i)=>`<div class="tile"><div></div><i></i><i style="width:${45+i*7}%"></i></div>`).join('');
    const card = (n) => `<div class="ref-card"><img src="public/references/photo-${String(n).padStart(2,'0')}.jpg" alt="" onerror="this.parentElement.classList.add('missing')"></div>`;
    document.querySelector('.wall-1').innerHTML = Array.from({length:15},(_,i)=>card(i+1)).join('');
    document.querySelector('.wall-2').innerHTML = Array.from({length:15},(_,i)=>card(i+16)).join('');
  </script>
</body>
</html>
